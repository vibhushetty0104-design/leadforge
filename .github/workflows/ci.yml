name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Ephemeral CI-only database; not a secret.
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: leadforge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d leadforge_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PG_URL: postgresql://ci:ci@localhost:5432/leadforge_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: "**/pyproject.toml"
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/core[dev]" -e "services/api[dev]" -e "services/worker[dev]"
      - name: Ruff (lint)
        run: ruff check packages services database scripts
      - name: Ruff (format)
        run: ruff format --check packages services database scripts
      - name: Mypy (strict)
        run: mypy packages/core/src services/api/src services/worker/src
      - name: Tests (SQLite)
        run: pytest packages services -q
      - name: Tests (Postgres, incl. SKIP LOCKED concurrency and migrations)
        run: pytest packages services -q
        env:
          TEST_DATABASE_URL: ${{ env.PG_URL }}
      - name: Migrations apply cleanly and match the models
        run: |
          alembic -c database/alembic.ini upgrade head
          alembic -c database/alembic.ini check
          alembic -c database/alembic.ini downgrade base
        env:
          DATABASE_URL: ${{ env.PG_URL }}

  contract:
    name: API contract is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: pip install -e packages/core -e services/api
      - run: npm ci --no-audit --no-fund
      - run: python scripts/export_openapi.py
      - run: npm run generate:api
      - name: Fail if generated files changed
        run: |
          git diff --exit-code -- packages/shared || {
            echo "::error::OpenAPI contract is stale. Run 'python scripts/export_openapi.py && npm run generate:api' and commit.";
            exit 1;
          }

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f services/api/Dockerfile -t leadforge-api:ci .
      - run: docker build -f services/worker/Dockerfile -t leadforge-worker:ci .
      - run: docker build -f apps/web/Dockerfile -t leadforge-web:ci .
