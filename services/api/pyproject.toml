[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "leadforge-api"
version = "0.1.0"
description = "LEADFORGE HTTP API."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "leadforge-core",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pyjwt[crypto]>=2.10,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx2>=2.16", "ruff>=0.8", "mypy>=1.13"]

[project.scripts]
leadforge-api = "leadforge_api.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/leadforge_api"]
