# Local development stack.
#
#   cp .env.example .env            # set POSTGRES_PASSWORD and SUPABASE_URL at minimum
#   docker compose up --build       # db + migrations + api + worker
#   docker compose --profile full up --build   # also runs the web app in a container
#
# Ports bind to 127.0.0.1 only. Supabase Auth is not part of this stack: use a
# free hosted Supabase project or `supabase start` (see docs/DEPLOYMENT.md).

name: leadforge

x-backend-env: &backend-env
  DATABASE_URL: postgresql://leadforge:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/leadforge
  ENVIRONMENT: ${ENVIRONMENT:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_JSON: ${LOG_JSON:-false}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leadforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: leadforge
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadforge -d leadforge"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: ["alembic", "-c", "database/alembic.ini", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      <<: *backend-env
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    environment: *backend-env
    stop_grace_period: 60s
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_BASE_URL: http://api:8000
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
